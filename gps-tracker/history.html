<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lịch sử dữ liệu hệ thống WPS Tracker Pro">
  <title>Lịch sử hệ thống - WPS TRACKER PRO</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="apple-page-body apple-theme">

  <nav class="apple-nav glassmorphism">
    <div class="nav-content">
      <a href="/dashboard.html" class="nav-brand">WPS TRACKER</a>
      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/history.html" class="nav-link active">Lịch sử</a>
        <a href="/overview.html" class="nav-link">Tổng quan</a>
        <button id="theme-toggle" class="apple-icon-btn">🌙</button>
      </div>
    </div>
  </nav>

  <div class="page-container">
    <div class="page-header">
      <h1 class="page-title">Dữ liệu Lịch sử Hệ thống</h1>
      <a href="/dashboard.html" class="apple-btn secondary" id="back-btn">
        <span class="icon">⬅</span> Quay lại Dashboard
      </a>
    </div>

    <div class="history-container">
      <!-- Bảng lộ trình -->
      <div class="apple-card">
        <div class="card-header">
          <h2 class="card-title">Lịch sử di chuyển</h2>
          <button class="apple-btn text success" id="export-excel-btn">
            <span class="icon">📥</span> Xuất Excel
          </button>
        </div>
        <div class="table-container apple-scroll">
          <table id="history-table" class="apple-table">
            <thead>
              <tr>
                <th>Thời gian</th>
                <th>Vĩ độ (Lat)</th>
                <th>Kinh độ (Lng)</th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Bảng sự cố té ngã -->
      <div class="apple-card danger-accent">
        <div class="card-header">
          <h2 class="card-title" style="color: var(--danger);">Sự cố Té ngã</h2>
          <button class="apple-btn text warning" id="export-fall-excel-btn">
            <span class="icon">📥</span> Xuất Excel
          </button>
        </div>
        <div class="table-container apple-scroll">
          <table id="fall-table" class="apple-table">
            <thead>
              <tr>
                <th>Thời gian</th>
                <th>Vĩ độ (Lat)</th>
                <th>Kinh độ (Lng)</th>
              </tr>
            </thead>
            <tbody id="fall-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/history.js"></script>
</body>
</html>
