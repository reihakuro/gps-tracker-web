<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập hệ thống WPS Tracker Pro - Nhóm 7 HCMUTE">
  <title>ĐĂNG NHẬP - WPS TRACKER PRO</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="apple-portal-body apple-theme">

  <div class="apple-portal-wrapper">
    <div class="portal-header">
      <img src="/picture/logo-ute.png" alt="HCMUTE Logo" class="school-logo">
      <h1 class="school-name">TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT<br>TP.HCM (HCM-UTE)</h1>
    </div>

    <div class="apple-portal-card glassmorphism">
      <h2 class="portal-title">Đăng nhập</h2>
      <p class="portal-subtitle">Hệ thống WPS Tracker Pro</p>

      <div class="portal-input-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" class="apple-input" placeholder="Tên đăng nhập">
      </div>

      <div class="portal-input-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" class="apple-input" placeholder="Nhập mật khẩu">
      </div>

      <button id="login-btn" class="apple-btn primary full-width" style="margin-top: 10px;">Đăng nhập</button>

      <div id="login-error" class="error-text">Tên đăng nhập hoặc mật khẩu sai!</div>

      <div class="portal-card-footer">
        <a href="#" class="forgot-link">Quên mật khẩu?</a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
